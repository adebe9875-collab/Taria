name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package binary and checksum
        run: |
          cp target/release/taria taria-linux-x86_64
          chmod 755 taria-linux-x86_64
          sha256sum taria-linux-x86_64 > taria-linux-x86_64.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            taria-linux-x86_64 \
            taria-linux-x86_64.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Taria $GITHUB_REF_NAME" \
            --generate-notes
