[package]
name = "taria"
version = "0.1.0"
edition = "2021"
description = "An open-source Linux package manager with a GTK desktop interface"
license = "MIT"
repository = "https://github.com/adebe9875-collab/Taria"

[[bin]]
name = "taria"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gtk4 = "0.10"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
